<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loan Approval Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    async function predictLoan(event) {
      event.preventDefault();

      const data = {
        no_of_dependents: parseInt(document.getElementById("no_of_dependents").value),
        education: document.getElementById("education").value,
        self_employed: document.getElementById("self_employed").value,
        income_annum: parseFloat(document.getElementById("income_annum").value),
        loan_amount: parseFloat(document.getElementById("loan_amount").value),
        loan_term: parseInt(document.getElementById("loan_term").value),
        cibil_score: parseInt(document.getElementById("cibil_score").value),
        residential_assets_value: parseFloat(document.getElementById("residential_assets_value").value),
        commercial_assets_value: parseFloat(document.getElementById("commercial_assets_value").value),
        luxury_assets_value: parseFloat(document.getElementById("luxury_assets_value").value),
        bank_asset_value: parseFloat(document.getElementById("bank_asset_value").value)
      };

      const response = await fetch("https://loan-approval-predictor-bvmx.onrender.com/docs", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      document.getElementById("result").innerHTML = `
        <p><strong>Logistic Regression:</strong> ${result.logistic_regression}</p>
        <p><strong>Decision Tree:</strong> ${result.decision_tree}</p>
      `;
    }
  </script>
</head>

<body>
  <h1>Loan Approval Prediction</h1>

  <form onsubmit="predictLoan(event)">
    <input id="no_of_dependents" placeholder="Number of Dependents" required />
    <input id="income_annum" placeholder="Annual Income" required />
    <input id="loan_amount" placeholder="Loan Amount" required />
    <input id="loan_term" placeholder="Loan Term" required />
    <input id="cibil_score" placeholder="CIBIL Score" required />
    <input id="residential_assets_value" placeholder="Residential Assets Value" required />
    <input id="commercial_assets_value" placeholder="Commercial Assets Value" required />
    <input id="luxury_assets_value" placeholder="Luxury Assets Value" required />
    <input id="bank_asset_value" placeholder="Bank Asset Value" required />

    <select id="education">
      <option value="Graduate">Graduate</option>
      <option value="Not Graduate">Not Graduate</option>
    </select>

    <select id="self_employed">
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>
</body>
</html>
