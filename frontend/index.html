<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loan Approval Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    form {
      display: grid;
      gap: 10px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input, select {
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1e4ed8;
    }

    #error {
      color: red;
      margin-top: 10px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #ecfeff;
      border-left: 5px solid #0284c7;
      border-radius: 5px;
    }

    #result p {
      margin: 5px 0;
      font-weight: bold;
    }
  </style>

  <script>
    async function predictLoan(event) {
      event.preventDefault();

      const errorDiv = document.getElementById("error");
      errorDiv.innerText = "";

      const data = {
        no_of_dependents: Number(document.getElementById("no_of_dependents").value),
        education: document.getElementById("education").value,
        self_employed: document.getElementById("self_employed").value,
        income_annum: Number(document.getElementById("income_annum").value),
        loan_amount: Number(document.getElementById("loan_amount").value),
        loan_term: Number(document.getElementById("loan_term").value),
        cibil_score: Number(document.getElementById("cibil_score").value),
        residential_assets_value: Number(document.getElementById("residential_assets_value").value),
        commercial_assets_value: Number(document.getElementById("commercial_assets_value").value),
        luxury_assets_value: Number(document.getElementById("luxury_assets_value").value),
        bank_asset_value: Number(document.getElementById("bank_asset_value").value)
      };

      // Frontend validation
      if (Object.values(data).some(v => Number.isNaN(v))) {
        errorDiv.innerText = "Please enter valid numeric values in all fields.";
        return;
      }

      const response = await fetch(
        "https://loan-approval-predictor-bvmx.onrender.com/predict",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        }
      );

      const result = await response.json();
      console.log("RAW RESPONSE:", result);

      const format = (text) =>
        text === "Approved"
          ? `<span style="color: green;">Approved</span>`
          : `<span style="color: red;">Rejected</span>`;

      document.getElementById("result").innerHTML = `
        <p>Logistic Regression: ${format(result.logistic_prediction)}</p>
        <p>Decision Tree: ${format(result.decision_tree_prediction)}</p>
      `;
    }
  </script>
</head>

<body>
  <div class="container">
    <h1>Loan Approval Prediction</h1>

    <form onsubmit="predictLoan(event)">
      <label for="no_of_dependents">Number of Dependents</label>
      <input id="no_of_dependents" type="number" min="0" required />

      <label for="education">Education</label>
      <select id="education" required>
        <option value="">Select education</option>
        <option value="Graduate">Graduate</option>
        <option value="Not Graduate">Not Graduate</option>
      </select>

      <label for="self_employed">Self Employed</label>
      <select id="self_employed" required>
        <option value="">Select option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label for="income_annum">Annual Income</label>
      <input id="income_annum" type="number" min="0" required />

      <label for="loan_amount">Loan Amount</label>
      <input id="loan_amount" type="number" min="0" required />

      <label for="loan_term">Loan Term (months)</label>
      <input id="loan_term" type="number" min="1" required />

      <label for="cibil_score">CIBIL Score</label>
      <input id="cibil_score" type="number" min="300" max="900" required />

      <label for="residential_assets_value">Residential Assets Value</label>
      <input id="residential_assets_value" type="number" min="0" required />

      <label for="commercial_assets_value">Commercial Assets Value</label>
      <input id="commercial_assets_value" type="number" min="0" required />

      <label for="luxury_assets_value">Luxury Assets Value</label>
      <input id="luxury_assets_value" type="number" min="0" required />

      <label for="bank_asset_value">Bank Asset Value</label>
      <input id="bank_asset_value" type="number" min="0" required />

      <button type="submit">Predict</button>
    </form>

    <div id="error"></div>
    <div id="result"></div>
  </div>
</body>
</html>
